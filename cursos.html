<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cursos - SoroHub</title>
  <link rel="stylesheet" href="css/estilos.css" />
  <link rel="icon" type="image/png" href="imagenes/logo_blanco.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/cursos.css" />
</head>
<body>

<header class="barra-superior">
  <div class="contenedor-logo">
    <img src="imagenes/logo_sorohub_blanco.png" alt="Logo SoroHub" class="logo-img">
    <span class="soroHub">SoroHub</span>
  </div>
  <nav class="navegacion">
    <a href="SoroHub.html">Inicio</a>
    <a href="cursos.html">Cursos</a>
    <a href="tareas.html">Tareas</a>
    <a href="creadores.html">Creadores</a>
  </nav>
  <div class="acciones">
    <a class="boton boton-secundario" href="login.html?modo=login">Iniciar sesión</a>
    <a class="boton boton-principal" href="login.html?modo=registro">Registrarse</a>
  </div>
</header>

<main>

  <!-- HERO -->
  <section class="hero-cursos">
    <div class="hero-cursos-texto">
      <div class="alumno-badge" id="alumno-badge">📚 Mis cursos</div>
      <h1>Mis Cursos</h1>
      <p>Accede a tus asignaturas, sigue tu progreso y continúa aprendiendo</p>
    </div>
    <div class="stats-cursos">
      <div class="stat-card">
        <span class="stat-valor" id="stat-total">0</span>
        <span class="stat-label">Matriculado</span>
      </div>
      <div class="stat-card">
        <span class="stat-valor" id="stat-progreso">0</span>
        <span class="stat-label">En progreso</span>
      </div>
      <div class="stat-card">
        <span class="stat-valor" id="stat-completados">0</span>
        <span class="stat-label">Completados</span>
      </div>
    </div>
  </section>

  <!-- CONTROLES -->
  <div class="controles-cursos">
    <div class="filtros-tab" id="filtros">
      <button class="tab-btn activo" data-filtro="todos">Todos</button>
      <button class="tab-btn" data-filtro="En progreso">En progreso</button>
      <button class="tab-btn" data-filtro="Completado">Completados</button>
      <button class="tab-btn" data-filtro="Sin empezar">Sin empezar</button>
    </div>
    <div class="buscador">
      <span>🔍</span>
      <input type="text" id="buscador" placeholder="Buscar curso o asignatura…">
    </div>
  </div>

  <!-- GRID -->
  <div class="contenedor-cursos">
    <div class="grid-cursos" id="gridCursos"></div>
  </div>

</main>

<footer class="pie-pagina">
  <p>© 2026 Plataforma Educativa - Equipo de desarrollo</p>
</footer>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/cursos.js"></script>
</body>
</html>
