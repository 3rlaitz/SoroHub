<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login de la página web de SoroHub">
    <meta name="author" content="Erlaitz Alonso, Eneko Martín, Arkaitz Jimenez">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="icon" href="../images/logo_SoroHub.png">

    <title>Login | SoroHub</title>
</head>
<body>

    <div class="login-container" id="login-card">
        
        <header class="login-header">
            <h1>SoroHub</h1>
            
            <div class="monster-circle">
                <img src="../images/monster-normal.png" alt="Monstruo SoroHub" class="monster-img img-normal">
                
                <img src="../images/monster-shy.png" alt="Monstruo tapándose los ojos" class="monster-img img-shy">
            </div>
        </header>

        <form class="login-form">
            <div class="input-group">
                <label for="username">Usuario o Correo del Centro</label>
                <input type="text" id="username" name="username" placeholder="ej. alu123@somo.eus" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password-input" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">Entrar</button>
        </form>
        
        <div class="login-footer">
            <p>¿No tienes cuenta? Contacta con secretaría.</p>
        </div>
    </div>

    <script>
        const passwordInput = document.getElementById('password-input');
        const loginCard = document.getElementById('login-card');

        // Cuando se hace clic en el campo de contraseña
        passwordInput.addEventListener('focus', () => {
            loginCard.classList.add('is-shy');
        });

        // Cuando se sale del campo de contraseña (click fuera)
        passwordInput.addEventListener('blur', () => {
            loginCard.classList.remove('is-shy');
        });
    </script>

</body>
</html>
